name: Importar likes del tweet fijado

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Importar replies con like
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USER_ID: ${{ secrets.X_USER_ID }}
          X_CONVERSATION_ID: ${{ secrets.X_CONVERSATION_ID }}
        run: python scripts/import_liked.py
      - name: Guardar cambios
        run: |
          git config user.name "glosario-bot"
          git config user.email "glosario-bot@users.noreply.github.com"
          git add terms.json data/imported-ids.json
          git diff --cached --quiet || git commit -m "Agregar términos aprobados con like"
          git push
